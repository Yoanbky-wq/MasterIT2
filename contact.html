<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Master IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Master IT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"> <a class="nav-link" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="formations.html">Formations</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="contenu container mt-4">
    <h2 class="text-center mb-4">Contactez-nous</h2>
    <form class="col-md-6 mx-auto" action="#" method="post" id="formulaire-contact" novalidate>
      <div class="mb-3">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" class="form-control" id="champ-nom" name="nom" placeholder="Votre nom" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
<input type="email" class="form-control" id="champ-email" name="email" placeholder="Votre email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
       <textarea class="form-control" id="champ-message" name="message" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Envoyer</button>
<p id="message-formulaire" class="mt-3"></p>

    </form>
  </main>

  <footer class="pied mt-5">
    <p>&copy; 2026  Master IT. Tous droits réservés.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
